name: Verificación
on:
  pull_request:
  push:
    branches: [develop]
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: alshafacturas_db
          POSTGRES_USER: alshafacturas_app
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U alshafacturas_app -d alshafacturas_db"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DB_PASSWORD: ci-only-password
      TEST_SUPERADMIN_EMAIL: admin@ci.test
      TEST_SUPERADMIN_PASSWORD: AlshaCiTestPassword2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: mvn -B -ntp -f backend/pom.xml verify
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend && npm run lint --prefix frontend
      - name: Iniciar API e interfaz
        run: |
          APP_BOOTSTRAP_SUPERADMIN_ENABLED=true SUPERADMIN_CORREO="$TEST_SUPERADMIN_EMAIL" SUPERADMIN_PASSWORD="$TEST_SUPERADMIN_PASSWORD" java -jar backend/target/backend-0.0.1-SNAPSHOT.jar > /tmp/backend.log 2>&1 &
          npm run dev --prefix frontend -- --port 5173 > /tmp/frontend.log 2>&1 &
          if ! python tests/wait_for_app.py; then
            cat /tmp/backend.log /tmp/frontend.log
            exit 1
          fi
      - run: python tests/test_api.py
      - run: python tests/test_control.py
      - run: python tests/test_subscriptions.py
      - run: python tests/test_experiencia.py
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test
        working-directory: frontend
