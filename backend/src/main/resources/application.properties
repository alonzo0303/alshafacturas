
spring.application.name=alshafacturas-backend

# Conexion con PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/alshafacturas_db
spring.datasource.username=alshafacturas_app
spring.datasource.password=${DB_PASSWORD}

# Configuracion de JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
